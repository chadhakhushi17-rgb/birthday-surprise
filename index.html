<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Investigation 🚨</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #11151a;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        /* TOP WARNING BAR */
        .top-bar {
            height: 50px;
            background: #e10600;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 5px;
            text-align: center;
        }

        /* MAIN PAGE */
        .case-file {
            background: #eee7d8;
            margin: 45px auto;
            width: 94%;
            max-width: 1150px;
            padding: 45px 55px;
            border: 8px solid #222;
            min-height: 650px;
        }

        /* SMALL CASE FILE TEXT */
        .case-number {
            font-size: 16px;
            letter-spacing: 4px;
            margin-bottom: 15px;
            color: #333;
        }

        /* KEEP SUBJECT AND NAME ON ONE LINE */
        .subject-title {
            display: flex;
            align-items: center;
            gap: 25px;
            margin-bottom: 35px;
            white-space: nowrap;
        }

        .subject-title .subject {
            font-size: clamp(40px, 6vw, 80px);
            font-weight: 900;
            color: #111;
            letter-spacing: 2px;
        }

        .subject-title .name {
            font-size: clamp(40px, 6vw, 80px);
            font-weight: 900;
            color: #d90000;
            letter-spacing: 2px;
        }

        /* PHOTO + DETAILS */
        .content {
            display: grid;
            grid-template-columns: 42% 58%;
            gap: 40px;
            align-items: center;
        }

        /* PHOTO FRAME */
        .photo-section {
            position: relative;
        }

        .photo-frame {
            background: #151515;
            padding: 18px;
            transform: rotate(-3deg);
            box-shadow: 10px 10px 0 #aaa;
        }

        .photo-frame img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .photo-label {
            color: white;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 12px;
        }

        /* RIGHT SIDE DETAILS */
        .details p {
            font-size: 22px;
            margin: 18px 0;
        }

        .details strong {
            color: #a91912;
        }

        /* CHARGE BOX */
        .charge-box {
            background: #171717;
            color: white;
            padding: 25px;
            margin-top: 25px;
            border-left: 10px solid #d90000;
        }

        .charge-title {
            color: #ff2a20;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .charge-text {
            font-size: 20px;
            line-height: 1.5;
        }

        /* BUTTON */
        .investigate-button {
            display: inline-block;
            margin-top: 30px;
            background: #df0700;
            color: white;
            border: none;
            padding: 20px 35px;
            font-size: 21px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 8px 8px 0 #222;
        }

        .investigate-button:hover {
            transform: scale(1.04);
        }

        /* RESPONSIVE FOR MOBILE */
        @media (max-width: 800px) {

            .top-bar {
                font-size: 13px;
                letter-spacing: 2px;
            }

            .case-file {
                padding: 30px 20px;
                margin: 20px auto;
            }

            .subject-title {
                gap: 12px;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .photo-frame img {
                height: 300px;
            }

            .details p {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <div class="top-bar">
        🚨 BIRTHDAY INVESTIGATION IN PROGRESS 🚨
    </div>

    <main class="case-file">

        <div class="case-number">
            CASE FILE: BIRTHDAY INVESTIGATION
        </div>

        <div class="subject-title">
            <span class="subject">SUBJECT:</span>
            <span class="name">MACHHLI</span>
        </div>

        <div class="content">

            <!-- PHOTO -->
            <div class="photo-section">
                <div class="photo-frame">
                    <img src="image.png" alt="Subject Machhli">
                    <div class="photo-label">
                        EVIDENCE PHOTO #001
                    </div>
                </div>
            </div>

            <!-- DETAILS -->
            <div class="details">

                <p>
                    <strong>NAME:</strong> Machhli 🐟
                </p>

                <p>
                    <strong>AGE:</strong> 21
                </p>

                <p>
                    <strong>STATUS:</strong> Somehow still functioning
                </p>

                <p>
                    <strong>THREAT LEVEL:</strong> Questionably high
                </p>

                <div class="charge-box">
                    <div class="charge-title">
                        PRIMARY CHARGE:
                    </div>

                    <div class="charge-text">
                        Successfully surviving 21 years while continuing to cause unnecessary chaos.
                    </div>
                </div>

                <button class="investigate-button"
                    onclick="alert('Investigation started. Unfortunately, there is no going back now. 👀')">

                    BEGIN INVESTIGATION →
                </button>

            </div>

        </div>

    </main>

</body>
</html>
