<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🚨 A Very Important Investigation 👀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d0f12;
      color: #111;
    }

    .top-bar {
      background: red;
      color: white;
      text-align: center;
      padding: 15px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 4px;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: #e8e0cf;
      padding: 50px;
      border: 8px solid #111;
    }

    .case-file {
      font-family: monospace;
      font-size: 16px;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(50px, 9vw, 110px);
      margin: 10px 0 50px;
      font-weight: 900;
    }

    h1 span {
      color: #d10000;
    }

    .content {
      display: flex;
      gap: 50px;
      align-items: center;
      flex-wrap: wrap;
    }

    .photo-card {
      width: 350px;
      background: #161616;
      padding: 15px 15px 40px;
      transform: rotate(-3deg);
      box-shadow: 10px 10px 0 #aaa;
    }

    .photo-card img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .photo-text {
      color: white;
      text-align: center;
      margin-top: 20px;
      font-family: monospace;
    }

    .details {
      flex: 1;
      min-width: 280px;
      font-size: 24px;
      line-height: 1.8;
    }

    .details b {
      color: #b00000;
    }

    .charge {
      background: #171717;
      color: white;
      padding: 30px;
      margin-top: 20px;
      border-left: 10px solid red;
      font-size: 22px;
      line-height: 1.6;
    }

    .charge b {
      color: red;
    }

    button {
      margin-top: 35px;
      width: 100%;
      background: #d40000;
      color: white;
      border: none;
      padding: 22px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      transform: scale(1.03);
    }

    @media (max-width: 700px) {
      .container {
        margin: 0;
        padding: 25px;
        border-width: 5px;
      }

      .content {
        justify-content: center;
      }

      .photo-card {
        width: 100%;
      }

      .photo-card img {
        height: auto;
        max-height: 500px;
      }

      .details {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    🚨 BIRTHDAY INVESTIGATION IN PROGRESS 🚨
  </div>

  <div class="container">

    <div class="case-file">
      CASE FILE #M-21-2026
    </div>

    <h1>
      SUBJECT: <span>MACHHLI</span>
    </h1>

    <div class="content">

      <div class="photo-card">
        <img src="./image.png" alt="Subject Machhli">

        <div class="photo-text">
          EVIDENCE PHOTO #001
        </div>
      </div>

      <div class="details">

        <div><b>NAME:</b> Machhli 🐟</div>
        <div><b>AGE:</b> 21</div>
        <div><b>STATUS:</b> Somehow still functioning</div>
        <div><b>THREAT LEVEL:</b> Questionably high</div>

        <div class="charge">
          <b>PRIMARY CHARGE:</b><br>
          Successfully surviving 21 years while continuing to cause unnecessary chaos.
        </div>

        <button onclick="beginInvestigation()">
          BEGIN INVESTIGATION →
        </button>

      </div>

    </div>

  </div>

  <script>
    function beginInvestigation() {
      alert("CASE ACCEPTED. Evidence will now be revealed... 👀");
    }
  </script>

</body>
</html>
