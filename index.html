<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Very Important Investigation 👀</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff4e6;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .container {
      padding: 30px;
      max-width: 700px;
      animation: appear 1.2s ease;
    }

    h1 {
      font-size: clamp(42px, 8vw, 80px);
      margin-bottom: 15px;
    }

    .warning {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .funny-photo {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 50%;
      border: 8px solid black;
      margin-bottom: 25px;
      transform: rotate(-3deg);
    }

    button {
      background: black;
      color: white;
      border: none;
      padding: 18px 30px;
      font-size: 18px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🚨 BREAKING NEWS 🚨</h1>

    <p class="warning">
      A highly suspicious individual has officially completed
      another orbit around the sun.
      <br><br>
      Unfortunately, you are about to discover evidence.
    </p>

    <!-- We will add his funny photo here later -->

    <br>

    <button onclick="alert('Congratulations. You clicked it. Unfortunately, there is no going back now. 👀')">
      ENTER AT YOUR OWN RISK
    </button>

  </div>

</body>
</html>
